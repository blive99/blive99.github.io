name: Check M3U8 Links

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Check M3U8
        run: python check_m3u8.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: working-m3u8-links
          path: working_links.txt
