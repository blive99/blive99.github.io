import asyncio
import aiohttp
import csv
import time

BASE = "https://YOUR-DOMAIN.com/api/proxy/stream?tv={}"

START_ID = 1
END_ID = 9999
CONCURRENCY = 25
TIMEOUT = 10

async def check(session, sem, tv_id):
    url = BASE.format(tv_id)

    async with sem:
        start = time.perf_counter()

        try:
            async with session.get(
                url,
                allow_redirects=True,
                headers={
                    "User-Agent": "Mozilla/5.0",
                    "Accept": "application/vnd.apple.mpegurl,"
                              "application/x-mpegURL,*/*",
                    "Range": "bytes=0-4095"
                },
                timeout=TIMEOUT
            ) as response:

                data = await response.content.read(4096)

                elapsed = time.perf_counter() - start
                content_type = response.headers.get(
                    "Content-Type", ""
                )

                is_hls = (
                    "mpegurl" in content_type.lower()
                    or data.lstrip().startswith(b"#EXTM3U")
                )

                result = {
                    "tv": tv_id,
                    "status": response.status,
                    "hls": is_hls,
                    "content_type": content_type,
                    "time": round(elapsed, 3),
                    "final_url": str(response.url),
                    "error": ""
                }

                if response.status == 200 and is_hls:
                    print(
                        f"[OK] TV={tv_id} "
                        f"{elapsed:.2f}s"
                    )
                else:
                    print(
                        f"[--] TV={tv_id} "
                        f"HTTP {response.status}"
                    )

                return result

        except Exception as e:
            return {
                "tv": tv_id,
                "status": 0,
                "hls": False,
                "content_type": "",
                "time": 0,
                "final_url": "",
                "error": str(e)
            }


async def main():

    connector = aiohttp.TCPConnector(
        limit=CONCURRENCY
    )

    timeout = aiohttp.ClientTimeout(
        total=TIMEOUT
    )

    sem = asyncio.Semaphore(CONCURRENCY)

    async with aiohttp.ClientSession(
        connector=connector,
        timeout=timeout
    ) as session:

        tasks = [
            check(session, sem, tv_id)
            for tv_id in range(START_ID, END_ID + 1)
        ]

        results = await asyncio.gather(*tasks)

    working = [
        r for r in results
        if r["status"] == 200 and r["hls"]
    ]

    with open(
        "working.txt",
        "w",
        encoding="utf-8"
    ) as f:

        for r in working:
            f.write(
                f'{r["tv"]}\n'
            )

    with open(
        "results.csv",
        "w",
        newline="",
        encoding="utf-8-sig"
    ) as f:

        writer = csv.DictWriter(
            f,
            fieldnames=[
                "tv",
                "status",
                "hls",
                "content_type",
                "time",
                "final_url",
                "error"
            ]
        )

        writer.writeheader()
        writer.writerows(results)

    print()
    print("==============================")
    print(f"ตรวจทั้งหมด : {len(results)}")
    print(f"ใช้งานได้   : {len(working)}")
    print("==============================")
    print("ผลลัพธ์: working.txt")
    print("รายละเอียด: results.csv")


if __name__ == "__main__":
    asyncio.run(main())
